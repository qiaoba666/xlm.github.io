<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3分钟测出你的皮肤正在偷偷变差的原因</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Helvetica Neue", sans-serif;
      background: #fff9ec;
      color: #333;
      overflow-x: hidden;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 18px 120px;
    }

    .brand {
      text-align: center;
      font-size: 14px;
      color: #999;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    .title {
      font-size: 30px;
      line-height: 1.4;
      font-weight: 700;
      color: #222;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .start-card,
    .question-card,
    .result-card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .start-btn,
    .option-btn,
    .submit-btn,
    .booking-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .start-btn,
    .submit-btn,
    .booking-btn {
      background: linear-gradient(135deg,#ffd54f,#ffb300);
      color: #222;
      font-weight: bold;
    }

    .start-btn:hover,
    .option-btn:hover,
    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .question-card {
      display: none;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #f1f1f1;
      border-radius: 20px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(135deg,#ffd54f,#ffb300);
      transition: 0.3s;
    }

    .question-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #222;
    }

    .option-btn {
      background: #fff9ec;
      color: #444;
      margin-bottom: 14px;
      text-align: left;
      line-height: 1.6;
      border: 2px solid transparent;
    }

    .option-btn:hover {
      border-color: #ffd54f;
      background: #fff3cd;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }

    .loading-circle {
      width: 60px;
      height: 60px;
      border: 6px solid #ffe082;
      border-top: 6px solid #ffb300;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .result-card {
      display: none;
      margin-top: 20px;
    }

    .result-tag {
      display: inline-block;
      background: #fff3cd;
      color: #b26a00;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .result-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .result-desc {
      font-size: 15px;
      line-height: 1.9;
      color: #555;
      margin-bottom: 22px;
    }

    .tips-box {
      background: #fff9ec;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .tips-box h4 {
      margin-bottom: 10px;
      color: #222;
    }

    .tips-box p {
      line-height: 1.8;
      color: #666;
      font-size: 14px;
    }

    .floating-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 500px;
      z-index: 999;
    }

    .floating-btn button {
      box-shadow: 0 8px 20px rgba(255,179,0,0.3);
    }

    .footer-tip {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.8;
    }

    @media(max-width:480px){
      .title{
        font-size:26px;
      }

      .question-title{
        font-size:20px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="brand">洗脸猫 · AI皮肤测试</div>

  <div class="start-card" id="startPage">
    <div class="title">《3分钟测出你的皮肤正在偷偷变差的原因》</div>

    <div class="subtitle">
      很多皮肤问题，<br>
      不只是护肤没做好。<br><br>
      你的黑头、暗沉、敏感、松弛，<br>
      可能正在悄悄变严重…
    </div>

    <button class="start-btn" onclick="startQuiz()">开始测试 ✨</button>

    <div class="footer-tip">
      已有 3827 人完成测试<br>
      测试结果仅供肌肤护理参考
    </div>
  </div>

  <div class="question-card" id="quizPage">

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-title" id="questionTitle"></div>

    <div id="options"></div>

  </div>

  <div class="loading" id="loadingPage">
    <div class="loading-circle"></div>
    <div>正在生成你的肌肤报告...</div>
  </div>

  <div class="result-card" id="resultPage">

    <div class="result-tag">AI肌肤诊断结果</div>

    <div class="result-title" id="resultTitle"></div>

    <div class="result-desc" id="resultDesc"></div>

    <div class="tips-box">
      <h4>💡 护理建议</h4>
      <p id="resultAdvice"></p>
    </div>

    <div class="tips-box">
      <h4>✨ 做完后你会明显感觉</h4>
      <p id="resultEffect"></p>
    </div>

  </div>

</div>

<div class="floating-btn" id="bookingBtn" style="display:none;">
  <button class="booking-btn" onclick="alert('请替换为你的微信/预约链接')">
    立即领取专属护理福利 🎁
  </button>
</div>

<script>

const questions = [
{
q:'最近照镜子时，你最不想面对哪里？',
options:[
{text:'😫 黑头毛孔越来越明显',score:1},
{text:'🥲 脸干到开始卡粉',score:2},
{text:'😵 脸又黄又没气色',score:3},
{text:'🐼 黑眼圈重得像没睡醒',score:4},
{text:'📉 感觉脸开始“挂不住肉”',score:5},
{text:'🥺 动不动就泛红敏感',score:6}
]
},
{
q:'熬夜后的你，更像哪种状态？',
options:[
{text:'🛢 满脸油到能反光',score:1},
{text:'🏜 干得像被吸走水分',score:2},
{text:'😮‍💨 一脸疲惫打工人味',score:3},
{text:'😭 眼睛肿得像刚哭完',score:4},
{text:'📸 法令纹越来越明显',score:5},
{text:'🌶 脸又红又痒',score:6}
]
},
{
q:'化妆/洗脸时，最容易让你崩溃的是？',
options:[
{text:'🫠 黑头怎么清都还有',score:1},
{text:'🧴 上妆永远卡粉',score:2},
{text:'😶 化妆了还是没气色',score:3},
{text:'🐼 遮瑕盖不住黑眼圈',score:4},
{text:'📉 拍照感觉脸变垮',score:5},
{text:'⚠️ 护肤品总容易刺激',score:6}
]
},
{
q:'朋友帮你拍照时，你最常吐槽的是？',
options:[
{text:'🥹 我鼻子怎么这么油',score:1},
{text:'🥲 我脸怎么这么干',score:2},
{text:'😩 我今天气色也太差',score:3},
{text:'🐼 黑眼圈怎么这么重',score:4},
{text:'📉 我脸是不是松了',score:5},
{text:'🌶 我脸怎么又红了',score:6}
]
},
{
q:'你的皮肤最像哪种“受害者”？',
options:[
{text:'🛢 熬夜爆油受害者',score:1},
{text:'🏜 空调房干尸',score:2},
{text:'😮‍💨 熬夜黄脸怪',score:3},
{text:'🐼 手机党熊猫眼',score:4},
{text:'📉 地心引力受害者',score:5},
{text:'🥺 敏感脆皮大学生',score:6}
]
},
{
q:'如果只能先改善一个问题，你最想解决？',
options:[
{text:'✨ 毛孔黑头',score:1},
{text:'💧 干燥粗糙',score:2},
{text:'🌤 暗沉没气色',score:3},
{text:'👀 黑眼圈眼袋',score:4},
{text:'📈 松弛下垂',score:5},
{text:'⚠️ 泛红敏感',score:6}
]
},
{
q:'你现在的皮肤状态，更接近哪句话？',
options:[
{text:'🛢 控油已经控累了',score:1},
{text:'💧 补水像无底洞',score:2},
{text:'😴 脸总像没睡醒',score:3},
{text:'🐼 眼睛比人还累',score:4},
{text:'📉 以前拍照没这么垮',score:5},
{text:'🥺 皮肤动不动闹情绪',score:6}
]
}
];

const results = [
{
min:7,
max:10,
title:'毛孔堵塞型肌肤',
desc:'你的皮肤容易出油、黑头反复出现，尤其鼻头和下巴区域，总感觉洗不干净。',
advice:'推荐【孔夫仔泡冲洗脸】深层清洁毛孔、软化黑头、调节水油平衡。',
effect:'黑头减少、皮肤更清爽、毛孔看起来更细腻。'
},
{
min:11,
max:15,
title:'缺水屏障型肌肤',
desc:'你的皮肤容易卡粉、紧绷、粗糙，补水很多但状态还是反复。',
advice:'推荐【好多水泡冲洗脸】深层补水、修护屏障、增强锁水能力。',
effect:'皮肤更水润、妆容更服帖、干燥感明显减少。'
},
{
min:16,
max:20,
title:'熬夜暗沉型肌肤',
desc:'你的皮肤容易暗黄、没气色，熬夜后整个人看起来特别疲惫。',
advice:'推荐【告白泡冲洗脸】提亮肤色、改善暗沉、提升通透感。',
effect:'气色更好、皮肤更透亮、整个人更显精神。'
},
{
min:21,
max:25,
title:'疲劳型眼周肌',
desc:'你的黑眼圈、眼周浮肿和细纹已经开始偷偷暴露疲惫感。',
advice:'推荐【微笑PASTA泡冲洗脸】温感按摩、射频导入、消水肿护理。',
effect:'黑眼圈减淡、眼周更平滑、眼睛更有神。'
},
{
min:26,
max:30,
title:'初老松弛型肌肤',
desc:'你的轮廓线开始变松，法令纹和下垂感越来越明显。',
advice:'推荐【普拉提泡冲洗脸】提拉紧致、激活胶原、改善轮廓松弛。',
effect:'轮廓更紧致、法令纹减淡、脸更显年轻。'
},
{
min:31,
max:42,
title:'敏感脆弱型肌肤',
desc:'你的皮肤容易泛红、刺痛、换季不稳定，已经进入“脆皮状态”。',
advice:'推荐【告白修护护理】舒缓泛红、修护屏障、提升稳定性。',
effect:'泛红减少、皮肤更稳定、舒适感明显提升。'
}
];

let currentQuestion = 0;
let totalScore = 0;

function startQuiz(){
  document.getElementById('startPage').style.display='none';
  document.getElementById('quizPage').style.display='block';
  renderQuestion();
}

function renderQuestion(){

  const question = questions[currentQuestion];

  document.getElementById('questionTitle').innerText = `Q${currentQuestion+1}. ${question.q}`;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML='';

  question.options.forEach(option=>{

    const btn = document.createElement('button');

    btn.className='option-btn';
    btn.innerText = option.text;

    btn.onclick = ()=>{
      totalScore += option.score;
      currentQuestion++;

      updateProgress();

      if(currentQuestion < questions.length){
        renderQuestion();
      }else{
        showLoading();
      }
    }

    optionsDiv.appendChild(btn);
  })

  updateProgress();
}

function updateProgress(){
  const progress = (currentQuestion/questions.length)*100;
  document.getElementById('progressBar').style.width = progress + '%';
}

function showLoading(){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('loadingPage').style.display='block';

  setTimeout(()=>{
    document.getElementById('loadingPage').style.display='none';
    showResult();
  },1800)
}

function showResult(){

  document.getElementById('resultPage').style.display='block';
  document.getElementById('bookingBtn').style.display='block';

  const result = results.find(r=> totalScore >= r.min && totalScore <= r.max);

  document.getElementById('resultTitle').innerText = result.title;
  document.getElementById('resultDesc').innerText = result.desc;
  document.getElementById('resultAdvice').innerText = result.advice;
  document.getElementById('resultEffect').innerText = result.effect;
}

</script>

</body>
</html>
