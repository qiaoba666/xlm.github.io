<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3分钟测出你的皮肤正在偷偷变差的原因</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Helvetica Neue", sans-serif;
      background: #fff9ec;
      color: #333;
      overflow-x: hidden;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 18px 120px;
    }

    .brand {
      text-align: center;
      font-size: 14px;
      color: #999;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    .title {
      font-size: 30px;
      line-height: 1.4;
      font-weight: 700;
      color: #222;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .start-card,
    .question-card,
    .result-card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .start-btn,
    .option-btn,
    .submit-btn,
    .booking-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .start-btn,
    .submit-btn,
    .booking-btn {
      background: linear-gradient(135deg,#ffd54f,#ffb300);
      color: #222;
      font-weight: bold;
    }

    .start-btn:hover,
    .option-btn:hover,
    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .question-card {
      display: none;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #f1f1f1;
      border-radius: 20px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(135deg,#ffd54f,#ffb300);
      transition: 0.3s;
    }

    .question-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #222;
    }

    .option-btn {
      background: #fff9ec;
      color: #444;
      margin-bottom: 14px;
      text-align: left;
      line-height: 1.6;
      border: 2px solid transparent;
    }

    .option-btn:hover {
      border-color: #ffd54f;
      background: #fff3cd;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }

    .loading-circle {
      width: 60px;
      height: 60px;
      border: 6px solid #ffe082;
      border-top: 6px solid #ffb300;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .result-card {
      display: none;
      margin-top: 20px;
    }

    .result-tag {
      display: inline-block;
      background: #fff3cd;
      color: #b26a00;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .result-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .result-desc {
      font-size: 15px;
      line-height: 1.9;
      color: #555;
      margin-bottom: 22px;
    }

    .tips-box {
      background: #fff9ec;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .tips-box h4 {
      margin-bottom: 10px;
      color: #222;
    }

    .tips-box p {
      line-height: 1.8;
      color: #666;
      font-size: 14px;
    }

    .floating-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 500px;
      z-index: 999;
    }

    .floating-btn button {
      box-shadow: 0 8px 20px rgba(255,179,0,0.3);
    }

    .footer-tip {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.8;
    }

    @media(max-width:480px){
      .title{
        font-size:26px;
      }

      .question-title{
        font-size:20px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="brand">洗脸猫 · AI皮肤测试</div>

  <div class="start-card" id="startPage">
    <div class="title">《3分钟测出你的皮肤正在偷偷变差的原因》</div>

    <div class="subtitle">
      很多皮肤问题，<br>
      不只是护肤没做好。<br><br>
      你的黑头、暗沉、敏感、松弛，<br>
      可能正在悄悄变严重…
    </div>

    <button class="start-btn" onclick="startQuiz()">开始测试 ✨</button>

    <div class="footer-tip">
      已有 3827 人完成测试<br>
      测试结果仅供肌肤护理参考
    </div>
  </div>

  <div class="question-card" id="quizPage">

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-title" id="questionTitle"></div>

    <div id="options"></div>

  </div>

  <div class="loading" id="loadingPage">
    <div class="loading-circle"></div>
    <div>正在生成你的肌肤报告...</div>
  </div>

  <div class="result-card" id="resultPage">

    <div class="result-tag">AI肌肤诊断结果</div>

    <div class="result-title" id="resultTitle"></div>

    <div class="tips-box">
      <h4>🔍 我们发现</h4>
      <p id="resultFind"></p>
    </div>

    <div class="tips-box">
      <h4>⚠️ 为什么会出现这个问题？</h4>
      <p id="resultWhy"></p>
    </div>

    <div class="tips-box">
      <h4>✅ 洗脸猫改善方案</h4>
      <p style="font-weight:bold;font-size:18px;color:#ff9800;" id="resultPlan"></p>
    </div>

    <div class="tips-box">
      <h4>🧴 护理步骤</h4>
      <p id="resultSteps"></p>
    </div>

    <div class="tips-box">
      <h4>💡 做完效果</h4>
      <p id="resultEffect"></p>
    </div>

  </div>

</div>

<div class="floating-btn" id="bookingBtn" style="display:none;">
  <button class="booking-btn" onclick="openPopup()">
    找吨吨领取专属福利 🎁
  </button>
</div>

<div id="popup" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:24px;padding:24px;max-width:360px;width:100%;text-align:center;position:relative;">

    <div onclick="closePopup()" style="position:absolute;right:18px;top:12px;font-size:28px;cursor:pointer;color:#999;">×</div>

    <h3 style="margin-bottom:12px;font-size:24px;">🎁 扫码领取专属福利</h3>

    <p style="font-size:14px;color:#666;line-height:1.8;margin-bottom:18px;">
      添加吨吨领取专属护肤福利<br>
      线上预约到店，还可找吨吨领取洁面慕斯哦～
    </p>

    <img src="皮肤AI问卷.png" style="width:240px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);">

  </div>
</div>

<script>

const questions = [
{
q:'最近照镜子时，你最不想面对哪里？',
options:[
{text:'😫 黑头毛孔越来越明显',score:1},
{text:'🥲 脸干到开始卡粉',score:2},
{text:'😵 脸又黄又没气色',score:3},
{text:'🐼 黑眼圈重得像没睡醒',score:4},
{text:'📉 感觉脸开始“挂不住肉”',score:5},
{text:'🥺 动不动就泛红敏感',score:6}
]
},
{
q:'熬夜后的你，更像哪种状态？',
options:[
{text:'🛢 满脸油到能反光',score:1},
{text:'🏜 干得像被吸走水分',score:2},
{text:'😮‍💨 一脸疲惫打工人味',score:3},
{text:'😭 眼睛肿得像刚哭完',score:4},
{text:'📸 法令纹越来越明显',score:5},
{text:'🌶 脸又红又痒',score:6}
]
},
{
q:'化妆/洗脸时，最容易让你崩溃的是？',
options:[
{text:'🫠 黑头怎么清都还有',score:1},
{text:'🧴 上妆永远卡粉',score:2},
{text:'😶 化妆了还是没气色',score:3},
{text:'🐼 遮瑕盖不住黑眼圈',score:4},
{text:'📉 拍照感觉脸变垮',score:5},
{text:'⚠️ 护肤品总容易刺激',score:6}
]
},
{
q:'朋友帮你拍照时，你最常吐槽的是？',
options:[
{text:'🥹 我鼻子怎么这么油',score:1},
{text:'🥲 我脸怎么这么干',score:2},
{text:'😩 我今天气色也太差',score:3},
{text:'🐼 黑眼圈怎么这么重',score:4},
{text:'📉 我脸是不是松了',score:5},
{text:'🌶 我脸怎么又红了',score:6}
]
},
{
q:'你的皮肤最像哪种“受害者”？',
options:[
{text:'🛢 熬夜爆油受害者',score:1},
{text:'🏜 空调房干尸',score:2},
{text:'😮‍💨 熬夜黄脸怪',score:3},
{text:'🐼 手机党熊猫眼',score:4},
{text:'📉 地心引力受害者',score:5},
{text:'🥺 敏感脆皮大学生',score:6}
]
},
{
q:'如果只能先改善一个问题，你最想解决？',
options:[
{text:'✨ 毛孔黑头',score:1},
{text:'💧 干燥粗糙',score:2},
{text:'🌤 暗沉没气色',score:3},
{text:'👀 黑眼圈眼袋',score:4},
{text:'📈 松弛下垂',score:5},
{text:'⚠️ 泛红敏感',score:6}
]
},
{
q:'你现在的皮肤状态，更接近哪句话？',
options:[
{text:'🛢 控油已经控累了',score:1},
{text:'💧 补水像无底洞',score:2},
{text:'😴 脸总像没睡醒',score:3},
{text:'🐼 眼睛比人还累',score:4},
{text:'📉 以前拍照没这么垮',score:5},
{text:'🥺 皮肤动不动闹情绪',score:6}
]
}
];

const results = [
{
min:7,
max:10,
title:'📋 你的皮肤诊断：毛孔堵塞型肌肤',
find:'你可能经常感觉脸洗不干净，鼻头黑头明显，下午容易满脸油光。',
why:'脸部油脂分泌旺盛后，废旧角质和油脂容易堵塞毛孔，就容易形成黑头闭口。',
plan:'孔夫仔泡冲洗脸',
steps:['深层清洁毛孔','软化黑头油脂','调节水油平衡','服务时长约40分钟'],
effect:'皮肤更清爽、黑头减少、毛孔更细腻。'
},
{
min:11,
max:15,
title:'📋 你的皮肤诊断：缺水屏障型肌肤',
find:'你最近可能容易卡粉、皮肤粗糙，洗完脸后有明显紧绷感。',
why:'皮肤缺水后，角质层锁水能力就会下降，所以屏障会越来越脆弱。',
plan:'好多水泡冲洗脸',
steps:['深层补水','修护屏障','增强锁水能力','服务时长约35分钟'],
effect:'皮肤更水润、妆容更服帖、减少干纹粗糙感。'
},
{
min:16,
max:20,
title:'📋 你的皮肤诊断：熬夜暗沉型肌肤',
find:'你最近可能脸色暗黄、没气色，看起来总是很疲惫。',
why:'熬夜会导致皮肤循环变差，代谢减慢，因此肤色更容易暗沉。',
plan:'告白泡冲洗脸',
steps:['提亮肤色','改善暗沉','提升皮肤通透感','服务时长约45分钟'],
effect:'肤色更透亮、气色更好、皮肤更有光泽感。'
},
{
min:21,
max:25,
title:'📋 你的皮肤诊断：疲劳型眼周肌',
find:'你的黑眼圈明显、眼周有细纹，或者眼睛容易浮肿没精神。',
why:'眼周皮肤是全身最薄的区域(只有面部皮肤的1/3)，没有皮脂腺，最容易干燥长纹。熬夜、用眼过度导致循环差，形成黑眼圈和浮肿。',
plan:'微笑PASTA泡冲洗脸',
steps:['温感按摩','射频导入','消水肿护理','服务时长约40分钟'],
effect:'黑眼圈淡化、眼周细纹减少、眼睛更有神。'
},
{
min:26,
max:30,
title:'📋 你的皮肤诊断：初老松弛型肌肤',
find:'你可能开始感觉法令纹明显，拍照时轮廓没有以前紧致。',
why:'25岁后胶原流失会逐渐加快，熬夜和压力会进一步加重松弛问题。',
plan:'普拉提泡冲洗脸',
steps:['提拉紧致','激活胶原','改善松弛问题','服务时长约50分钟'],
effect:'轮廓更紧致、法令纹减淡、脸部状态更年轻。'
},
{
min:31,
max:42,
title:'📋 你的皮肤诊断：敏感脆弱型肌肤',
find:'你的皮肤可能更容易泛红、刺痛，换季时状态不稳定。',
why:'当皮肤屏障受损后，外界刺激更容易进入皮肤，就会引发敏感泛红。',
plan:'好多水泡冲洗脸',
steps:['深层补水','修护屏障','增强锁水能力','服务时长约35分钟'],
effect:'皮肤更稳定、补水、泛红减少、舒适度提升。'
}
];

let currentQuestion = 0;
let totalScore = 0;

function startQuiz(){
  document.getElementById('startPage').style.display='none';
  document.getElementById('quizPage').style.display='block';
  renderQuestion();
}

function renderQuestion(){

  const question = questions[currentQuestion];

  document.getElementById('questionTitle').innerText = `Q${currentQuestion+1}. ${question.q}`;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML='';

  question.options.forEach(option=>{

    const btn = document.createElement('button');

    btn.className='option-btn';
    btn.innerText = option.text;

    btn.onclick = ()=>{
      totalScore += option.score;
      currentQuestion++;

      updateProgress();

      if(currentQuestion < questions.length){
        renderQuestion();
      }else{
        showLoading();
      }
    }

    optionsDiv.appendChild(btn);
  })

  updateProgress();
}

function updateProgress(){
  const progress = (currentQuestion/questions.length)*100;
  document.getElementById('progressBar').style.width = progress + '%';
}

function showLoading(){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('loadingPage').style.display='block';

  setTimeout(()=>{
    document.getElementById('loadingPage').style.display='none';
    showResult();
  },1800)
}

function showResult(){

  document.getElementById('resultPage').style.display='block';
  document.getElementById('bookingBtn').style.display='block';

  const result = results.find(r=> totalScore >= r.min && totalScore <= r.max);

  document.getElementById('resultTitle').innerText = result.title;
  document.getElementById('resultTitle').innerText = result.title;
document.getElementById('resultFind').innerText = result.find;
document.getElementById('resultWhy').innerText = result.why;
document.getElementById('resultPlan').innerText = '【'+result.plan+'】';
document.getElementById('resultSteps').innerHTML = `1️⃣ ${result.steps[0]}<br><br>2️⃣ ${result.steps[1]}<br><br>3️⃣ ${result.steps[2]}`;
document.getElementById('resultEffect').innerText = result.effect;
}

function openPopup(){
  document.getElementById('popup').style.display='flex';
}

function closePopup(){
  document.getElementById('popup').style.display='none';
}

</script>

</body>
</html>
